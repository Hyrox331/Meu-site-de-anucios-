<!DOCTYPE html><html lang="pt-BR">
<head>


<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6872862987106561"
     crossorigin="anonymous"></script>
<meta name="google-adsense-account" content="ca-pub-6872862987106561">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdPay - Assistindo Anúncios</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    :root {
      --color-roxo: #6c5ce7;
      --color-azul: #0984e3;
      --color-vermelho: #d63031;
      --color-branco: #ffffff;
      --color-preto: #2d3436;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--color-roxo), var(--color-preto));
      color: var(--color-branco);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    body::before {
      content: 'AdPay   AdPay   AdPay   AdPay   AdPay';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 6rem;
      color: rgba(255,255,255,0.03);
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: rgba(0,0,0,0.7);
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 600px;
      position: relative;
      z-index: 1;
    }
    .intro {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: var(--color-branco);
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 2rem;
      color: var(--color-azul);
    }
    .adsbygoogle {
      width: 100%;
      height: 300px;
      border: 2px solid var(--color-branco);
      border-radius: 8px;
      display: block;
    }
    .timer {
      margin-top: 1rem;
      font-size: 1.5rem;
      color: var(--color-vermelho);
    }
    .message {
      margin-top: 1.5rem;
      font-size: 1.4rem;
      color: var(--color-vermelho);
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body::before {
        font-size: 4rem;
      }
      .intro {
        font-size: 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .timer {
        font-size: 1.2rem;
      }
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6872862987106561"
     crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <p class="intro">a outras formas de pagar sem se quer ter dinheiro 💰😎</p>
    <h1>Assista aos anúncios para concluir o pagamento</h1>

    <!-- BLOCO DE ANÚNCIO -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-6872862987106561"
         data-ad-slot="6830845654"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <div class="timer">Tempo restante: <span id="timeLeft">0</span>s</div>
    <div id="doneMessage" class="message" style="display:none;">
      Pagamento concluído com sucesso!
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const mins = parseFloat(params.get('min')) || 1;
    let timeLeft = Math.ceil(mins * 60);
    const timeEl = document.getElementById('timeLeft');
    const doneMsg = document.getElementById('doneMessage');

    timeEl.textContent = timeLeft;
    const countdown = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(countdown);
        doneMsg.style.display = 'block';
        setTimeout(() => window.location.href = 'index.html', 2000);
      }
    }, 1000);
  </script>
</body>
</html>
